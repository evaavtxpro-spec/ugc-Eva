document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

18px; border-radius: 100px; font-weight: 600;\" style-hover=\"background:#E7C9DC\">Me contacter<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <section style=\"background: #4A001F; color: #F1E5EF; display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); align-items: center; gap: clamp(30px, 5vw, 76px); padding: clamp(44px, 7vw, 96px) clamp(20px, 5vw, 64px) clamp(52px, 8vw, 104px);\">\n    <div style=\"display: flex; justify-content: center;\">\n      <div style=\"position: relative; width: min(360px, 80vw); aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; background: #1a0110; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6); animation: evaFloat 7s ease-in-out infinite;\">\n        <img src=\"media/Photo%20N%C2%B011.JPG\" alt=\"Eva\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 620px;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(241,229,239,0.62); margin-bottom: 18px;\">Community Management · Stratégie · Création de contenu<\u002Fdiv>\n      <h1 style=\"font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(36px, 5.2vw, 72px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 24px; text-wrap: pretty;\">Faites de vos réseaux sociaux un <span style=\"font-style: italic; color: #E0B8D6;\">véritable outil<\u002Fspan> pour votre marque.<\u002Fh1>\n      <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.58; max-width: 54ch; color: rgba(241,229,239,0.82); margin: 0 0 34px;\">Je suis Eva, Community Manager indépendante. J'accompagne les marques et entreprises dans leur communication sur les réseaux sociaux, de la réflexion stratégique à la création et la publication de contenus.<\u002Fp>\n      <a href=\"#contact\" style=\"text-decoration: none; display: inline-block; background: #F1E5EF; color: #4A001F; font-weight: 600; font-size: 16px; padding: 16px 28px; border-radius: 100px;\" style-hover=\"background:#E7C9DC\">PARLONS DE VOTRE PROJET →<\u002Fa>\n      <p style=\"font-size: 14px; color: rgba(241,229,239,0.6); margin: 18px 0 0;\">Basée en Bretagne · J'accompagne des projets partout en France<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #F1E5EF; padding: clamp(56px, 9vw, 118px) clamp(20px, 5vw, 64px);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(30px, 5vw, 72px); align-items: center;\">\n      <div>\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4A001F; margin-bottom: 16px;\">(01)<\u002Fdiv>\n        <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -0.02em; margin: 0 0 26px; text-wrap: pretty;\">Derrière les réseaux, <span style=\"font-style: italic; color: #4A001F;\">il y a moi<\u002Fspan><\u002Fh2>\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.68; color: rgba(39,2,21,0.78); margin: 0 0 18px; max-width: 56ch;\">Moi, c'est Eva. Issue d'une formation en Communication &amp; Media, j'ai eu l'occasion de développer mon expérience à travers différents projets de communication, notamment lors de mon alternance chez Paysan Breton Les Surgelés, mais aussi à travers mes propres projets et mes premiers clients en tant qu'indépendante.<\u002Fp>\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.68; color: rgba(39,2,21,0.72); margin: 0 0 18px; max-width: 56ch;\">Aujourd'hui, j'accompagne les marques et entreprises qui souhaitent développer leur présence sur les réseaux sociaux avec une communication authentique, créative et surtout cohérente avec leur identité.<\u002Fp>\n        <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.68; color: rgba(39,2,21,0.72); margin: 0; max-width: 56ch;\">Ce que j'aime dans le Community Management ? Pouvoir entrer dans l'univers d'une marque, comprendre ce qui la rend unique et trouver la meilleure façon de le raconter sur les réseaux.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; justify-content: center;\">\n        <div style=\"position: relative; width: 100%; max-width: 420px; aspect-ratio: 4 / 5; border-radius: 24px; overflow: hidden; background: #E7C9DC; box-shadow: 0 30px 60px -30px rgba(74,0,31,0.45);\">\n          <img src=\"media/bio.jpg\" alt=\"Eva\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #270215; color: #F1E5EF; padding: clamp(56px, 9vw, 118px) clamp(20px, 5vw, 64px);\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #C87BB9; margin-bottom: 16px;\">(02)<\u002Fdiv>\n      <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(32px, 5vw, 62px); line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 clamp(30px, 4vw, 48px);\">Ma <span style=\"font-style: italic; color: #C87BB9;\">vision<\u002Fspan><\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: clamp(30px, 5vw, 70px); align-items: start;\">\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ vision }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <p style=\"font-family: 'Playfair Display', serif; font-weight: 500; font-style: italic; font-size: clamp(20px, 2.3vw, 30px); line-height: 1.32; letter-spacing: -0.015em; color: #FFFFFF; margin: 0; padding: 16px 0; border-bottom: 1px solid rgba(241,229,239,0.14);\">{{ v }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.66; color: #F1E5EF; margin: 0 0 20px; max-width: 52ch;\">Pour moi, le Community Management consiste avant tout à créer une présence qui a du sens : comprendre une audience, raconter une histoire, transmettre les valeurs d'une entreprise et créer progressivement une relation avec sa communauté.<\u002Fp>\n          <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.66; color: rgba(241,229,239,0.76); margin: 0; max-width: 52ch;\">Mon objectif n'est donc pas de remplir un calendrier de publications, mais de construire avec vous une communication qui vous ressemble et qui donne envie de vous suivre.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"methode\" style=\"background: #F1E5EF; padding: clamp(56px, 9vw, 118px) clamp(20px, 5vw, 64px); scroll-margin-top: 76px;\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4A001F; margin-bottom: 16px;\">(03) — Ma façon de travailler<\u002Fdiv>\n      <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(30px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.02em; margin: 0 0 clamp(30px, 4vw, 48px); max-width: 22ch; text-wrap: pretty;\">Une méthode simple, mais <span style=\"font-style: italic; color: #4A001F;\">pensée pour votre marque<\u002Fspan>.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: clamp(16px, 2.2vw, 24px); margin-bottom: clamp(28px, 4vw, 44px);\">\n        <sc-for list=\"{{ etapes }}\" as=\"e\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; flex-direction: column; background: #fff; border: 1px solid rgba(74,0,31,0.14); border-radius: 22px; padding: clamp(24px, 2.8vw, 32px); min-height: 230px;\">\n            <div style=\"font-family: 'Playfair Display', serif; font-wei er-events: none;\"><\u002Fdiv>\n                <span style=\"position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; background: rgba(241,229,239,0.2); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #F1E5EF; pointer-events: none;\">▶<\u002Fspan>\n              <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #F1E5EF; padding: clamp(56px, 9vw, 118px) clamp(20px, 5vw, 64px);\">\n    <div style=\"max-width: 900px; margin: 0 auto;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4A001F; margin-bottom: 16px;\">(06) — Pourquoi je fais ça<\u002Fdiv>\n      <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(30px, 4.8vw, 60px); line-height: 1.04; letter-spacing: -0.02em; margin: 0 0 28px; text-wrap: pretty;\">Parce que j'aime transformer une idée <span style=\"font-style: italic; color: #4A001F;\">en contenu<\u002Fspan>.<\u002Fh2>\n      <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.68; color: rgba(39,2,21,0.78); margin: 0 0 18px; max-width: 62ch;\">Ce que j'aime dans les réseaux sociaux, c'est qu'ils permettent de donner une voix aux marques. Une entreprise peut avoir un excellent produit, une vraie expertise ou une histoire passionnante… mais encore faut-il réussir à la raconter. C'est justement là que j'interviens.<\u002Fp>\n      <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.68; color: rgba(39,2,21,0.72); margin: 0 0 18px; max-width: 62ch;\">J'aime chercher le bon angle, le bon format et les bons mots pour transformer ce que vous faites au quotidien en contenu que votre audience aura réellement envie de regarder, de lire et de partager.<\u002Fp>\n      <p style=\"font-size: clamp(16px, 1.4vw, 19px); line-height: 1.68; color: rgba(39,2,21,0.72); margin: 0; max-width: 62ch;\">Et surtout, j'aime travailler avec les marques de manière collaborative : je ne viens pas plaquer une stratégie toute faite, je construis une communication avec vous.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #4A001F; color: #F1E5EF; padding: clamp(56px, 9vw, 118px) clamp(20px, 5vw, 64px);\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: clamp(28px, 4vw, 44px);\">\n        <div style=\"max-width: 640px;\">\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #E0B8D6; margin-bottom: 16px;\">(07) — Mon terrain d'expérimentation<\u002Fdiv>\n          <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(30px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.02em; margin: 0 0 20px;\">Je teste aussi tout ça <span style=\"font-style: italic; color: #E0B8D6;\">pour moi<\u002Fspan>.<\u002Fh2>\n          <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.64; color: rgba(241,229,239,0.76); margin: 0 0 16px;\">En parallèle de mes projets clients, je développe mon propre univers sur Instagram autour du running, du sport, du lifestyle et de la création de contenu. Mon compte me permet de tester au quotidien de nouveaux formats, d'analyser ce qui attire l'attention, de travailler le storytelling et de comprendre ce qui crée réellement de l'engagement.<\u002Fp>\n          <p style=\"font-size: clamp(16px, 1.3vw, 18px); line-height: 1.64; color: #F1E5EF; margin: 0;\">En d'autres termes : je ne me contente pas de vous conseiller sur les réseaux sociaux, je les pratique moi-même au quotidien.<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"https://instagram.com/evaa.vtx\" target=\"_blank\" style=\"text-decoration: none; display: inline-flex; align-items: ce  clamp(20px, 5vw, 64px);\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4A001F; margin-bottom: 16px;\">(08)<\u002Fdiv>\n      <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(32px, 5vw, 62px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 clamp(30px, 4vw, 48px);\">Pourquoi travailler <span style=\"font-style: italic; color: #4A001F;\">ensemble<\u002Fspan> ?<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: clamp(16px, 2.2vw, 24px);\">\n        <sc-for list=\"{{ pourquoi }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"background: #fff; border: 1px solid rgba(74,0,31,0.14); border-radius: 22px; padding: clamp(24px, 2.8vw, 32px);\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(19px, 2vw, 24px); margin: 0 0 12px; letter-spacing: -0.01em;\">{{ p.titre }}<\u002Fh3>\n            <p style=\"font-size: 15px; line-height: 1.62; color: rgba(39,2,21,0.7); margin: 0;\">{{ p.texte }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" style=\"background: #270215; color: #F1E5EF; padding: clamp(66px, 10vw, 140px) clamp(20px, 5vw, 64px); scroll-margin-top: 76px; text-align: center;\">\n    <div style=\"max-width: 860px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(36px, 6.4vw, 86px); line-height: 0.98; letter-spacing: -0.025em; margin: 0 0 24px; text-wrap: pretty;\">Et si on parlait de <span style=\"font-style: italic; color: #C87BB9;\">votre marque<\u002Fspan> ?<\u002Fh2>\n      <p style=\"font-size: clamp(16px, 1.4vw, 20px); line-height: 1.58; color: rgba(241,229,239,0.8); max-width: 56ch; margin: 0 auto 12px;\">Vous avez envie de développer votre présence sur les réseaux sociaux, mais vous ne savez pas par où commencer ? Ou vous manquez simplement de temps pour vous en occuper ?<\u002Fp>\n      <p style=\"font-size: clamp(16px, 1.4vw, 20px); line-height: 1.58; color: #F1E5EF; margin: 0 auto 34px;\">Parlons de votre projet.<\u002Fp>\n      <a href=\"mailto:evaa.vtxpro@gmail.com?subject=Mon%20projet%20community%20management\" style=\"text-decoration: none; display: inline-block; background: #F1E5EF; color: #4A001F; font-weight: 600; font-size: clamp(16px, 1.8vw, 18px); padding: 16px 30px; border-radius: 100px;\" style-hover=\"background:#E7C9DC\">ME PARLER DE MON PROJET →<\u002Fa>\n      <div style=\"display: flex; justify-content: center; gap: 12px; margin-top: 32px;\">\n        <a href=\"https://instagram.com/evaa.vtx\" target=\"_blank\" aria-label=\"Instagram\" style=\"text-decoration: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(241,229,239,0.45); display: flex; align-items: center; justify-content: center; color: #F1E5EF;\" style-hover=\"borderColor:#F1E5EF\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.2\" cy=\"6.8\" r=\"1\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"mailto:evaa.vtxpro@gmail.com\" aria-label=\"Email\" style=\"text-decoration: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(241,229,239,0.45); display: flex; align-items: center; justify-content: center; color: #F1E5EF;\" style-hover=\"borderColor:#F1E5EF\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 7l9 6 9-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: #1a0110; color: rgba(241,229,239,0.55); padding: 30px clamp(20px, 5vw, 64px); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; font-size: 13px;\">\n    <a href=\"index.html\" style=\"text-decoration: none; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 19px; color: #F1E5EF;\">evaa.vtx<\u002Fa>\n    <span>© 2026 · Community Manager &amp; créatrice de contenu · Bretagne<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const media = \"media/\";\n    return {\n      vision: [\n        \"Être présent sur les réseaux ne suffit pas.\",\n        \"Publier trois fois par semaine n'est pas une stratégie.\",\n        \"Avoir de jolies photos ne suffit pas à créer une communauté.\",\n        \"Suivre toutes les tendances n'a aucun intérêt si elles ne correspondent pas à votre marque.\"\n      ],\n      etapes: [\n        { num: \"01\", titre: \"Comprendre\", texte: \"Avant de créer, je prends le temps de comprendre votre marque, vos objectifs, votre audience et ce qui vous différencie.\" },\n        { num: \"02\", titre: \"Imaginer\", texte: \"Je construis une ligne éditoriale et cherche les formats, sujets et angles qui permettront de faire passer vos messages de manière naturelle.\" },\n        { num: \"03\", titre: \"Créer\", texte: \"Vidéos, carrousels, stories, légendes… Je transforme les idées en contenus adaptés aux codes de chaque plateforme.\" },\n        { num: \"04\", titre: \"Analyser & ajuster\", texte: \"Je regarde ce qui fonctionne, ce qui peut être amélioré et j'ajuste progressivement la stratégie pour faire évoluer votre présence.\" }\n      ],\n      services: [\n        { num: \"01\", titre: \"Stratégie éditoriale\", texte: \"Définition des piliers de contenu, ligne éditoriale, calendrier et objectifs.\" },\n        { num: \"02\", titre: \"Création de contenu\", texte: \"Reels, vidéos courtes, carrousels, stories et contenus adaptés à votre identité.\" },\n        { num: \"03\", titre: \"Rédaction\", texte: \"Légendes, accroches, storytelling et textes pensés pour votre audience.\" },\n        { num: \"04\", titre: \"Publication & programmation\", texte: \"Organisation et gestion de votre calendrier éditorial.\" },\n        { num: \"05\", titre: \"Animation de communauté\", texte: \"Interactions, commentaires, messages et création de lien avec votre audience.\" },\n        { num: \"06\", titre: \"Analyse des performances\", texte: \"Suivi des résultats et recommandations pour faire évoluer les contenus.\" }\n      ],\n      playCard: (e) => { const v = e.currentTarget.querySelector(\"video\"); if (v) v.play().catch(() => {}); },\n      stopCard: (e) => { const v = e.currentTarget.querySelector(\"video\"); if (v) { v.pause(); v.currentTime = 0; } },\n      amontTasks: [\"Stratégie de contenu\", \"Calendrier éditorial\", \"Reels & vidéos\", \"Carrousels\", \"Stories\", \"Rédaction\"],\n      pbStats: [\n        { valeur: \"58 723\", label: \"vues cumulées\" },\n        { valeur: \"16\", label: \"contenus créés en organique\" },\n        { valeur: \"2\", label: \"mois d'accompagnement\" }\n      ],\n      ccStats: [\n        { valeur: \"21 800\", label: \"vues cumulées\" },\n        { valeur: \"3\", label: \"contenus créés dont 2 publiés\" },\n        { valeur: \"2\", label: \"prestations réalisées\" }\n      ],\n      pourquoi: [\n        { titre: \"Une approche personnalisée\", texte: \"Pas de stratégie copiée-collée. Votre communication doit partir de votre marque.\" },\n        { titre: \"Une communication authentique\", texte: \"Des contenus pensés pour créer une relation avec votre audience, pas seulement pour vendre.\" },\n        { titre: \"Une double expertise\", texte: \"Community Management + création de contenu : je peux réfléchir à la stratégie tout en produisant concrètement les contenus.\" },\n        { titre: \"Une vraie implication\", texte: \"Je travaille comme une extension de votre équipe, avec l'envie de comprendre votre univers et vos enjeux.\" },\n        { titre: \"Une vision créative & stratégique\", texte: \"Parce qu'un beau contenu sans objectif reste simplement… un beau contenu.\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
